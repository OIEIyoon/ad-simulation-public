remote_theme: mmistakes/minimal-mistakes

locale: ko-KR
title: Autonomous Driving Notes
description: 자율주행 연구노트

# Minimal Mistakes 설정
minimal_mistakes_skin: default
search: true

# 네비게이션
breadcrumbs: true

# Mermaid 다이어그램
mermaid:
  version: "10.6.0"

# Footer
footer:
  links: []

# 댓글 (Giscus)
comments:
  provider: custom

giscus:
  repo: "OIEIyoon/ad-simulation-public"
  repo_id: "R_kgDOQrhk2g"
  category: "Announcements"
  category_id: "DIC_kwDOQrhk2s4C0AYW"
  mapping: "pathname"
  strict: "0"
  reactions_enabled: "1"
  theme: "preferred_color_scheme"
  lang: "ko"

# 기본 레이아웃/사이드바 설정
defaults:
  - scope:
      path: ""
    values:
      layout: single
      sidebar:
        nav: "docs"
      classes: wide
      comments: true
      toc: true
      toc_sticky: true

# 플러그인
plugins:
  - jekyll-remote-theme
  - jekyll-include-cache

# 빌드 제외
exclude:
  - CLAUDE.md
  - .claude/
  - README.md
  - "**/CLAUDE.md"
  - Gemfile
  - Gemfile.lock
